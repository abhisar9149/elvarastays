<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Property — Birchwood Residences</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header" id="site-header"></header>

  <main id="property-main">
    <section class="tight">
      <div class="wrap">
        <p class="loading-note" id="loading-note">Loading property…</p>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/shared.js"></script>
  <script>
    function starString(n) {
      const full = "★".repeat(Math.max(0, Math.min(5, n)));
      const empty = "☆".repeat(5 - Math.max(0, Math.min(5, n)));
      return full + empty;
    }

    (async function init() {
      await renderChrome("property");

      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      const properties = await loadJSON(DATA_PATH.properties);
      const main = document.getElementById("property-main");

      if (!properties) {
        main.innerHTML = `<section class="tight"><div class="wrap"><p class="empty-note">Could not load property data.</p></div></section>`;
        return;
      }

      const property = properties.find(p => p.id === id) || properties[0];

      if (!property) {
        main.innerHTML = `<section class="tight"><div class="wrap"><p class="empty-note">No properties found. Add one in data/properties.json.</p></div></section>`;
        return;
      }

      document.getElementById("page-title").textContent = `${property.name} — Birchwood Residences`;

      const otherProperties = properties.filter(p => p.id !== property.id);

      main.innerHTML = `
        <section class="tight">
          <div class="wrap">
            <p class="section-eyebrow">${escapeHTML(property.tagline || "")}</p>
            <h1>${escapeHTML(property.name)}</h1>
            ${(property.description || []).map(para => `<p style="max-width:62ch">${escapeHTML(para)}</p>`).join("")}
          </div>
        </section>

        <section class="tight">
          <div class="wrap">
            <div class="gallery">
              ${(property.images || []).slice(0, 5).map(img => `
                <a href="${escapeHTML(img)}" target="_blank" rel="noopener">
                  <img src="${escapeHTML(img)}" alt="${escapeHTML(property.name)} photo" loading="lazy">
                </a>
              `).join("")}
            </div>
          </div>
        </section>

        <section>
          <div class="wrap">
            <p class="section-eyebrow">What's included</p>
            <h2>Amenities</h2>
            <ul class="amenities-list">
              ${(property.amenities || []).map(a => `<li>${escapeHTML(a)}</li>`).join("")}
            </ul>
          </div>
        </section>

        <section>
          <div class="wrap">
            <p class="section-eyebrow">Rooms &amp; pricing</p>
            <h2>Where you'll stay</h2>
            <div class="room-grid">
              ${(property.rooms || []).map(r => `
                <div class="room-card">
                  <h3>${escapeHTML(r.name)}</h3>
                  <p class="price">${escapeHTML(r.price)}</p>
                  <p class="occupancy">${escapeHTML(r.occupancy || "")}</p>
                  <p>${escapeHTML(r.notes || "")}</p>
                </div>
              `).join("")}
            </div>
          </div>
        </section>

        <section>
          <div class="wrap">
            <p class="section-eyebrow">Getting here</p>
            <h2>Location</h2>
            <div class="location-block">
              <div>
                <p><strong>${escapeHTML(property.location?.address || "")}</strong></p>
                <p>${escapeHTML(property.location?.directionsNote || "")}</p>
              </div>
              <div class="map-frame">
                <iframe src="${escapeHTML(property.location?.mapEmbed || "")}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Map to ${escapeHTML(property.name)}"></iframe>
              </div>
            </div>
          </div>
        </section>

        <section>
          <div class="wrap">
            <p class="section-eyebrow">Guests have stayed</p>
            <h2>Reviews</h2>
            <div class="review-grid">
              ${(property.reviews || []).map(r => `
                <div class="review-card">
                  <p class="review-stars">${starString(r.rating)}</p>
                  <p class="review-text">${escapeHTML(r.text)}</p>
                  <p class="review-guest">${escapeHTML(r.guest)}</p>
                </div>
              `).join("")}
            </div>
          </div>
        </section>

        ${otherProperties.length ? `
        <section class="tight">
          <div class="wrap">
            <p class="section-eyebrow">Also by us</p>
            <h2>Our other property</h2>
            <div class="property-grid">
              ${otherProperties.map(p => `
                <article class="property-card">
                  <a href="property.html?id=${encodeURIComponent(p.id)}" class="property-card-image">
                    <img src="${escapeHTML(p.heroImage)}" alt="${escapeHTML(p.name)}" loading="lazy">
                  </a>
                  <div class="property-card-body">
                    <p class="property-card-tagline">${escapeHTML(p.tagline || "")}</p>
                    <h3>${escapeHTML(p.name)}</h3>
                    <a href="property.html?id=${encodeURIComponent(p.id)}" class="btn btn-outline">View property</a>
                  </div>
                </article>
              `).join("")}
            </div>
          </div>
        </section>` : ""}

        <section class="tight center">
          <div class="wrap">
            <h2>Ready to book?</h2>
            <p>Send us your dates and we'll confirm availability within a day.</p>
            <a href="contact.html" class="btn btn-primary">Contact us</a>
          </div>
        </section>
      `;
    })();
  </script>
</body>
</html>
