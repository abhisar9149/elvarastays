<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About — Birchwood Residences</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header" id="site-header"></header>

  <main>
    <section class="hero hero-plain">
      <div class="wrap">
        <p class="hero-eyebrow">Our story</p>
        <h1 id="about-title">About us</h1>
      </div>
    </section>

    <section class="tight about-body" id="about-body">
      <div class="wrap">
        <p class="loading-note">Loading…</p>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/shared.js"></script>
  <script>
    (async function init() {
      const site = await renderChrome("about");
      const body = document.getElementById("about-body");
      if (!site) {
        body.innerHTML = `<div class="wrap"><p class="empty-note">Could not load page content.</p></div>`;
        return;
      }
      document.getElementById("about-title").textContent = site.aboutTitle || "About us";
      body.innerHTML = `
        <div class="wrap">
          ${(site.aboutBody || []).map(p => `<p>${escapeHTML(p)}</p>`).join("")}
        </div>
      `;
    })();
  </script>
</body>
</html>
