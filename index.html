<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birchwood Residences — Modern apartments in Dehradun</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header" id="site-header"></header>

  <main>
    <section class="hero" id="hero">
      <div class="wrap">
        <p class="hero-eyebrow">Dehradun, Uttarakhand</p>
        <h1 id="hero-title">Thoughtfully designed interiors</h1>
        <p class="lede" id="hero-note">Serviced apartments in Dehradun.</p>
        <a href="#properties" class="btn btn-primary">See our apartments</a>
      </div>
    </section>

    <section id="properties">
      <div class="wrap">
        <p class="section-eyebrow">Our properties</p>
        <h2>Pick your apartment</h2>
        <p>Two buildings in Dehradun, five minutes apart by car, each suited to a different kind of stay.</p>

        <div class="property-grid" id="property-grid">
          <p class="loading-note">Loading properties…</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/shared.js"></script>
  <script>
    (async function init() {
      const site = await renderChrome("home");
      if (site) {
        document.getElementById("hero-note").textContent = site.heroNote || "";
        if (site.heroImage) {
          document.getElementById("hero").style.backgroundImage = `url('${site.heroImage}')`;
        }
      }

      const properties = await loadJSON(DATA_PATH.properties);
      const grid = document.getElementById("property-grid");

      if (!properties || properties.length === 0) {
        grid.innerHTML = `<p class="empty-note">No properties yet. Add one in data/properties.json.</p>`;
        return;
      }

      grid.innerHTML = properties.map(p => `
        <article class="property-card">
          <a href="property.html?id=${encodeURIComponent(p.id)}" class="property-card-image">
            <img src="${escapeHTML(p.heroImage)}" alt="${escapeHTML(p.name)}" loading="lazy">
            ${lowestPrice(p.rooms) ? `<span class="price-badge">${escapeHTML(lowestPrice(p.rooms))}</span>` : ""}
          </a>
          <div class="property-card-body">
            <h3>${escapeHTML(p.name)}</h3>
            <p class="property-card-tagline">${escapeHTML(p.tagline || "")}</p>
            <p>${escapeHTML(p.shortDescription || "")}</p>
            <a href="property.html?id=${encodeURIComponent(p.id)}" class="btn btn-outline">View property</a>
          </div>
        </article>
      `).join("");
    })();
  </script>
</body>
</html>
