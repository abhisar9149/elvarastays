<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Birchwood Residences</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header" id="site-header"></header>

  <main>
    <section class="hero">
      <div class="hero-contours" id="hero-contours"></div>
      <div class="wrap">
        <p class="hero-eyebrow">Get in touch</p>
        <h1>Contact us</h1>
        <p class="lede">Tell us your dates and which property you'd like, and we'll reply within a day.</p>
      </div>
    </section>

    <section class="tight">
      <div class="wrap contact-grid">
        <div>
          <dl class="contact-info" id="contact-info"></dl>
        </div>

        <div>
          <form class="contact-form" id="contact-form">
            <div>
              <label for="name">Name</label>
              <input type="text" id="name" name="name" required>
            </div>
            <div>
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required>
            </div>
            <div>
              <label for="property">Property</label>
              <select id="property" name="property">
                <option value="Either / not sure">Either / not sure</option>
                <option value="Aspen Residence">Aspen Residence</option>
                <option value="Cedar Residence">Cedar Residence</option>
              </select>
            </div>
            <div>
              <label for="dates">Dates</label>
              <input type="text" id="dates" name="dates" placeholder="e.g. 12–15 Oct">
            </div>
            <div>
              <label for="message">Message</label>
              <textarea id="message" name="message" rows="4"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Send message</button>
            <p class="form-status" id="form-status"></p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/shared.js"></script>
  <script>
    (async function init() {
      const site = await renderChrome("contact");
      document.getElementById("hero-contours").innerHTML = contourSVG({ lines: 5, opacity: 0.4 });

      const info = document.getElementById("contact-info");
      if (site) {
        info.innerHTML = `
          <dt>Phone</dt><dd><a href="tel:${escapeHTML(site.phone || "")}">${escapeHTML(site.phone || "")}</a></dd>
          <dt>WhatsApp</dt><dd><a href="https://wa.me/${escapeHTML((site.whatsapp || "").replace(/[^0-9]/g, ""))}" target="_blank" rel="noopener">${escapeHTML(site.whatsapp || "")}</a></dd>
          <dt>Email</dt><dd><a href="mailto:${escapeHTML(site.email || "")}">${escapeHTML(site.email || "")}</a></dd>
          <dt>Address</dt><dd>${escapeHTML(site.address || "")}</dd>
        `;
      }

      const form = document.getElementById("contact-form");
      const status = document.getElementById("form-status");

      // This site has no backend, so the form opens a pre-filled email
      // to your address instead of submitting silently. If you move to
      // Netlify or Formspree later, see README.md "Upgrading the contact
      // form" for a two-line change to make it submit directly.
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const data = new FormData(form);
        const subject = encodeURIComponent(`Booking enquiry — ${data.get("property")}`);
        const body = encodeURIComponent(
          `Name: ${data.get("name")}\nEmail: ${data.get("email")}\nProperty: ${data.get("property")}\nDates: ${data.get("dates")}\n\n${data.get("message")}`
        );
        const mailTo = site?.email || "hello@example.com";
        window.location.href = `mailto:${mailTo}?subject=${subject}&body=${body}`;
        status.textContent = "Opening your email app to send this…";
      });
    })();
  </script>
</body>
</html>
